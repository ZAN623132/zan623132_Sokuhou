<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="私学大会まとめサイトです">
  <link rel = "stylesheet" href="style.css" type="text/css">
  <title>速報ダッシュボード - 明大明治</title>
  <style>
    /* --- 基本スタイル --- */
    :root {
      --color-bg: #f4f5f7;
      --card-bg: #ffffff;
      --color-text: #333333;
      --color-text-secondary: #666666;
      --color-bg-thirdly: #e0e0e0;
      --color-bg-secondary: #1a365d;
      --accent-individual: #2b6cb0;
      --accent-relay: #2c7a7b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* --- レイアウト --- */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      background-color: var(--color-bg-secondary);
      color: #ffffff;
      padding: 16px 0;
      margin-bottom: 20px;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title { font-size: 1.2rem; font-weight: bold; }
    .header-status { font-size: 0.8rem; color: #cbd5e0; margin-top: 4px; }

    button.btn-refresh {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button.btn-refresh:hover { background-color: rgba(255, 255, 255, 0.3); }

    /* --- レース結果カード --- */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--color-bg-thirdly);
      border-radius: 6px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .card-header {
      background: #edf2f7;
      padding: 10px 16px;
      border-bottom: 1px solid var(--color-bg-thirdly);
      /* display: flex; */
      /* justify-content: space-between; */
      /* align-items: center; */
    }

    .card-title a {
      
      font-weight: bold;
      color: var(--color-bg-secondary);
      
    }
    .card-title a:hover { text-decoration: underline; }

    .card-updated { font-size: 0.75rem; color: var(--color-text-secondary); }
    .card-body { padding: 12px 16px; }

    /* --- 項目内表示 (個人 / リレー) --- */
    .result-item {
      padding: 10px 12px;
      border-radius: 4px;
      margin-bottom: 8px;
      border-left: 4px solid var(--color-bg-thirdly);
    }
    .result-item:last-child { margin-bottom: 0; }

    .result-individual {
      background-color: #ebf8ff;
      border-left-color: var(--accent-individual);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-relay {
      background-color: #e6fffa;
      border-left-color: var(--accent-relay);
    }

    .athlete-name { font-weight: bold; font-size: 1rem; }
    .athlete-sub { font-size: 0.8rem; color: var(--color-text-secondary); }
    .record-value { font-weight: bold; font-size: 1.1rem; }

    .runners-list {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #cbd5e0;
      font-size: 0.85rem;
      color: #2d3748;
    }

    /* --- 状態表示 --- */
    .empty-msg { text-align: center; color: var(--color-text-secondary); padding: 20px 0; }
    .error-msg { background: #fed7d7; color: #9b2c2c; padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header class="page-header">
    <div>
      <a href="index.html">
        <span>トップページ</span>
      </a>
    </div>
    <button class="btn-refresh" onclick="fetchData()">手動更新</button>
  </header>  

  <!-- <header>
    <div class="container header-inner">
      <div>
        <div class="header-title">明大明治 陸上部 速報ダッード</div>
        <div id="status-time" class="header-status">データ取得中...</div>
      </div>
      <button class="btn-refresh" onclick="fetchData()">手動更新</button>
    </div>
  </header> -->

  <main class="container">
    <div>
      <h1>最速速報システム</h1>
      <span id="visitor-count" style="margin-left: 10px; opacity: 0.8;">| 累計アクセス: 取得中...</span>
      <div id="status-time" class="header-status">データ取得中...</div>
    <div id="error-container" class="error-msg" style="display: none;"></div>
    <div id="app-root"></div>
    </div>
  </main>

  <script>
    // -------------------------------------------------------------------
    // システム設定
    // -------------------------------------------------------------------
    const GIST_ID = "5ec30843576673021e71a22cef4e4b31";
    const REFRESH_INTERVAL_SEC = 15;




// -------------------------------------------------------------------
    // アクセスカウンター処理 (CounterAPI v2 対応版)
    // -------------------------------------------------------------------
    async function updateVisitorCount() {
      const countEl = document.getElementById("visitor-count");

      try {
        // ワークスペース名（旧namespace）とカウンター名（全角/記号不可、英数ハイフンのみ）
        const workspace = "meiji-meiji-rikujo-2026";
        const key = "visits";
        
        // API v2 のカウントアップ用 URL
        const res = await fetch(`https://api.counterapi.dev/v2/${workspace}/${key}/up`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

        const result = await res.json();
        
        // v2のレスポンス構造（result.data.count または result.count）から数値を取得
        const count = result.data?.count ?? result.count;

        if (countEl && count !== undefined) {
          countEl.textContent = `| 累計アクセス: ${Number(count).toLocaleString()} 回`;
        }
      } catch (err) {
        console.error("アクセス数の取得に失敗:", err);
        if (countEl) {
          countEl.textContent = `| 累計アクセス: - 回`;
        }
      }
    }



    
    // -------------------------------------------------------------------
    // データ取得処理
    // -------------------------------------------------------------------
    async function fetchData() {
      const errorEl = document.getElementById("error-container");
      errorEl.style.display = "none";

      try {
        // API経由ではなく Raw URL から直接取得（60回/時の制限を受けない）
        const rawUrl = `https://gist.githubusercontent.com/raw/${GIST_ID}/results.json?_t=${Date.now()}`;
        const response = await fetch(rawUrl);
        
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        // Raw通信の場合はそのまま JSON として解析できる
        const data = await response.json();
        render(data);

        document.getElementById("status-time").textContent = 
          `最終取得: ${new Date().toLocaleTimeString("ja-JP")} (15秒毎自動更新)`;

      } catch (err) {
        console.error(err);
        errorEl.textContent = `通信/解析エラー: ${err.message}`;
        errorEl.style.display = "block";
      }
    }

    // -------------------------------------------------------------------
    // 描画処理 (データ構造を展開)
    // -------------------------------------------------------------------
    function render(payload) {
      const root = document.getElementById("app-root");
      root.innerHTML = "";

      const urls = Object.keys(payload);
      if (urls.length === 0) {
        root.innerHTML = '<div class="empty-msg">監視対象データがありません</div>';
        return;
      }

      urls.forEach(url => {
        const race = payload[url];
        root.appendChild(createCardElement(race));
      });
    }

    // レースカード単位のHTML生成
    function createCardElement(race) {
      const card = document.createElement("div");
      card.className = "card";

      // ヘッダー部
      const header = document.createElement("div");
      header.className = "card-header";
      header.innerHTML = `
        <div class="card-title">
          <a href="${escapeHtml(race.url)}" target="_blank">${escapeHtml(race.race_title)}</a>
        </div>
        <div class="card-updated">更新: ${escapeHtml(race.last_updated || '-')}</div>
      `;
      card.appendChild(header);

      // ボディ部
      const body = document.createElement("div");
      body.className = "card-body";

      if (!race.results || race.results.length === 0) {
        body.innerHTML = '<div class="empty-msg">対象選手データなし</div>';
      } else {
        race.results.forEach(res => {
          body.appendChild(createResultItemElement(res));
        });
      }

      card.appendChild(body);
      return card;
    }

    // 選手・チーム単位のHTML生成
    function createResultItemElement(res) {
      const item = document.createElement("div");

      if (res.type === "relay") {
        item.className = "result-item result-relay";
        item.innerHTML = `
          <div style="display:flex; justify-between; font-weight:bold;">
            
            <span class="record-value">${escapeHtml(res.rank_and_record)}</span>
          </div>
          <div class="runners-list">
            ${res.runners.map(r => `<div>${escapeHtml(r)}</div>`).join("")}
          </div>
        `;
      } else {
        item.className = "result-item result-individual";
        item.innerHTML = `
          <div>
            <div class="athlete-name">${escapeHtml(res.rank_and_num)} | ${escapeHtml(res.name)} | ${escapeHtml(res.record)}</div>
          </div>
        `;
      }

      return item;
    }

    // セキュリティ対策（XSSエスケープ）
    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // -------------------------------------------------------------------
    // 起動処理 & 定期実行
    // -------------------------------------------------------------------
    fetchData();
    updateVisitorCount();
    setInterval(fetchData, REFRESH_INTERVAL_SEC * 1000);
  </script>
</body>
</html>
